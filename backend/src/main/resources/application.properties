spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=smartlib
spring.data.mongodb.auto-index-creation=true
server.port=${PORT:8080}
spring.application.name=smartlib-backend

# The dev profile is no longer the default. Run locally with
#   SPRING_PROFILES_ACTIVE=dev  (or -Dspring.profiles.active=dev)
# to enable /api/dev/* and demo seeding.

# ── SmartLib business configuration (overridable) ──
app.pickup-deadline-hours=48
app.loan-days=14
app.fine-per-day=5
app.lost-book-fine=500
app.on-time-return-points=10
app.max-active-loans=3
app.max-waitlist-entries=5
app.scheduler.expiry-check-ms=60000
app.scheduler.overdue-check-ms=60000
app.scheduler.reminder-check-ms=300000

# ── Auth, reflections, fines, recommendations ──
# Secret for signing JWTs. Must be provided (min 32 chars) or startup fails.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480
app.reflection-points=20
app.damaged-book-fine=200
app.recommendation-limit=8
app.reflection-min-length=50

# ── Iteration 4 hardening / operations ──
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.seed-demo=${APP_SEED_DEMO:false}
app.notification-retention-days=90
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.attempts-per-minute=10

# Actuator: only the health endpoint is exposed, and it is public.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
