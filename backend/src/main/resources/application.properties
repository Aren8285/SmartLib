spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=smartlib
server.port=8080
spring.application.name=smartlib-backend
# Dev profile unlocks /api/dev/* testing endpoints (passage-of-time simulation)
spring.profiles.active=dev

# ── SmartLib business configuration (overridable) ──
app.pickup-deadline-hours=48
app.loan-days=14
app.fine-per-day=5
app.lost-book-fine=500
app.on-time-return-points=10
app.max-active-loans=3
app.max-waitlist-entries=5
app.scheduler.expiry-check-ms=60000
app.scheduler.overdue-check-ms=60000
app.scheduler.reminder-check-ms=300000

# ── Iteration 3: auth, reflections, fines, recommendations ──
# Secret for signing JWTs. Must be provided (min 32 chars) or startup fails.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480
app.reflection-points=20
app.damaged-book-fine=200
app.recommendation-limit=8
app.reflection-min-length=50
